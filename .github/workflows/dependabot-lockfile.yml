name: Update bun.lock for Dependabot PRs

# Dependabot bumps package.json but never updates bun.lock, so Quality Gate's
# --frozen-lockfile install rejects every one of its PRs on arrival.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

concurrency:
  group: dependabot-lockfile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Regenerate bun.lock
        run: bun install

      - name: Commit and push if the lockfile changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already up to date."
          else
            # No skip-CI marker here: this push is what gives Quality Gate a
            # working lockfile, so it must be allowed to trigger the re-run.
            git add bun.lock
            git commit -m "chore: update bun.lock"
            git push
          fi
