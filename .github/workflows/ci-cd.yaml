# Deploys prod through the deploy webhook when a pull request into prod is merged, using
# agent-config-kit's reusable deploy-webhook workflow. README § CI/CD has the rest.
name: CI/CD Pipeline

on:
  pull_request:
    types: [closed]
    branches: [prod]

# Deploys queue behind each other and none is cancelled: every merge into prod gets its deploy.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger-deploy:
    name: Trigger Deploy
    # Only a merge deploys: a pull request closed without merging skips this job.
    if: github.event.pull_request.merged == true
    permissions:
      contents: read
    uses: adhibuchori/agent-config-kit/.github/workflows/deploy-webhook.yml@8699a5bed2aa9d986c459f65b3e519c7bbe162d1 # v1.2.0
    with:
      # The docs repository (<github-org>/<docs-repo>) to send app-deployed to; empty sends nothing.
      docs-repository: ''
    secrets:
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      DOCS_DISPATCH_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
