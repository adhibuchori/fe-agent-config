# Strips the AI config from prod after a merge, back-merges into dev and checks both, through
# agent-config-kit's reusable strip-ai workflow. /promote-deploy runs .github/scripts/ by hand.
name: Strip AI Files on PR Merge to Prod

on:
  pull_request:
    branches: [prod]
    types: [closed]

# Not the deploy's group: a strip queued behind a deploy in a shared group can be cancelled silently.
concurrency:
  group: prod-strip-ai
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  strip-ai:
    name: Strip AI Files
    if: github.event.pull_request.merged == true
    permissions:
      contents: write # push the strip commit to prod and the back-merge to dev
    uses: adhibuchori/agent-config-kit/.github/workflows/strip-ai.yml@8699a5bed2aa9d986c459f65b3e519c7bbe162d1 # v1.2.0
    with:
      # The reusable workflow's list plus this: the same list as .github/scripts/strip-paths.sh.
      extra-paths: promote-deploy-logs
