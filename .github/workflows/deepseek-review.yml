# An AI review of each pull request into dev by DeepSeek, through agent-config-kit's reusable
# workflow. It needs the DEEPSEEK_API_KEY secret (without it, it passes); README § CI/CD has the rest.
name: DeepSeek Code Review

on:
  pull_request:
    # dev only: a dev -> prod diff re-adds the AI config the strip removed.
    types: [opened, reopened, ready_for_review]
    branches: [dev]
  # `/ask-deepseek` on a pull request. GitHub runs it from the default branch's copy of this file.
  issue_comment:
    types: [created]

permissions:
  contents: read

# A newer request replaces a running review; any other comment gets a group of its own.
concurrency:
  group: deepseek-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ (github.event_name == 'issue_comment' && !startsWith(github.event.comment.body, '/ask-deepseek')) && github.run_id || 'review' }}
  cancel-in-progress: true

jobs:
  deepseek-review:
    name: DeepSeek Code Review
    # A branch of this repository (a fork's run gets no secret), or /ask-deepseek from an owner,
    # member or collaborator. The job checks nothing out: it reads the diff over the API.
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ask-deepseek') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read # read the pull request and its changed files over the API
      pull-requests: write # post or update the one review comment
    uses: adhibuchori/agent-config-kit/.github/workflows/deepseek-review.yml@8699a5bed2aa9d986c459f65b3e519c7bbe162d1 # v1.2.0
    with:
      # What this repository is and the rules no gate checks; lockfiles are always left out.
      instructions: |
        Next.js 16 + React 19 project on strict
        TypeScript, with Tailwind v4, next-intl (en/id), Zustand, and React
        Hook Form + Zod.

        Project rules that apply here:
        - React Compiler is active — do NOT suggest useMemo/useCallback/memo().
        - Files <=150 lines (blank lines and comments not counted), nesting <=4
          levels.
        - A component holds no logic: state, effects and derived values live in
          a hook under src/hooks/, pure functions in src/lib/.
        - One JSDoc block per exported function or component, directly above it.
        - No hardcoded UI text — it must go through next-intl, and en.json and
          id.json are always changed together.
        - src/lib/api/generated/ and .env.* must never be edited by hand.
        - Component files kebab-case exporting PascalCase names; hook files and
          names camelCase; directories, constants and types kebab-case.

        Do NOT report anything the Quality Gate already enforces on this same
        PR: formatting, lint, type-check, dependency audit, secret scanning,
        tests and 100% coverage of the logic layer, dead code, folder shape,
        translation parity, hook placement, re-exports, logic in components,
        Tailwind class form, error-code mapping, build, source maps.
      exclude: 'src/lib/api/generated/* src/messages/*.json'
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
