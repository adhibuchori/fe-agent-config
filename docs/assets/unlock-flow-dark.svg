<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="t d">
<title id="t">Unlock flow</title>
<desc id="d">Four steps: .env files are locked by default; you run '! bun unlock env'; the agent edits through a helper script that keeps values masked; the lock closes itself after 20 minutes. Targets are env (20 minutes) and db (15 minutes, write queries).</desc>
