<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">A blocked command in action</title>
<desc id="d">Animated terminal demo in a window titled claude — my-app. The agent types 'git push --force origin main'; the hedgehog raises its shield and a pink line appears: 'blocked by safety-check (exit 2): force-push to a protected branch'. The agent then types 'git status' and a sky-blue line appears: 'allowed (exit 0)'. The scene holds, then resets and loops.</desc>
