r}@keyframes cur{0%{transform:translate(0px,-208px);opacity:0}2.44%{transform:translate(0px,-208px);opacity:1}3.89%{transform:translate(0px,-208px);opacity:1;animation-timing-function:steps(28,end)}20.56%,22.22%{transform:translate(268.8px,-208px);opacity:1}23.33%{transform:translate(268.8px,-208px);opacity:0}49.44%{transform:translate(0px,-104px);opacity:0}50.56%{transform:translate(0px,-104px);opacity:1}52.78%{transform:translate(0px,-104px);opacity:1;animation-timing-function:steps(10,end)}59.44%,61.11%{transform:translate(96.0px,-104px);opacity:1}62.22%{transform:translate(96.0px,-104px);opacity:0}67.22%{transform:translate(0px,0px);opacity:0}68.33%,74.44%,81.11%,86.67%{transform:translate(0px,0px);opacity:1}75.56%,80%,87.78%,91.11%{transform:translate(0px,0px);opacity:.2}92.22%{transform:translate(0px,0px);opacity:.9}96.11%{transform:translate(0px,0px);opacity:0}100%{transform:translate(0px,-208px);opacity:0}}.shield{animation-name:shield}@keyframes shield{0%,24.44%{transform:rotate(-10deg) translate(-6px,32px)}28.33%{transform:rotate(2deg) translate(0px,-3px)}30.56%,32.22%{transform:rotate(0deg) translate(0px,0px)}33.89%{transform:rotate(-4deg) translate(0px,0px)}35.56%{transform:rotate(3deg) translate(0px,0px)}37.22%,91.11%{transform:rotate(0deg) translate(0px,0px)}96.11%,100%{transform:rotate(-10deg) translate(-6px,32px)}}.hop{transform-origin:50% 100%;animation-name:hop}@keyframes hop{0%,24.44%,30.56%,62.78%,70.56%,100%{transform:translateY(0px)}27.22%{transform:translateY(-7px)}64.67%{transform:translateY(-5px)}66.67%{transform:translateY(0px)}68.56%{transform:translateY(-3px)}}.shd{animation-name:shd}@keyframes shd{0%,24.44%,30.56%,62.78%,70.56%,100%{transform:scale(1)}27.22%{transform:scale(.9)}64.67%{transform:scale(.93)}66.67%{transform:scale(1)}68.56%{transform:scale(.96)}}.glint{animation:glint 4.6s ease-in-out infinite}@keyframes glint{0%,93%,96%,100%{opacity:1}93.6%,95.4%{opacity:0}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}</style>
