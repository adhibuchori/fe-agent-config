<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 702" role="img" aria-labelledby="t d">
<title id="t">Install in three steps</title>
<desc id="d">Step 1: /plugin marketplace add adhibuchori/agent-config-kit. Step 2: /plugin install agent-core and one stack plugin, for example agent-fe-nextjs. Step 3: run /&lt;plugin&gt;:setup, which shows a dry run before applying.</desc>
<defs>
<style>.s{font-family:'Plus Jakarta Sans', system-ui, sans-serif}.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-variant-ligatures:none}</style>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
<feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1c1a15" flood-opacity="0.08"/>
</filter>
</defs>
<clipPath id="cc">
<rect x="1" y="1" width="1098" height="700" rx="28"/>
</clipPath>
<rect x="1" y="1" width="1098" height="700" rx="28" fill="#fbfaf7" stroke="#e8e4da" stroke-width="2"/>
<text class="s" x="60" y="78" font-size="34" font-weight="800" fill="#1c1a15">Install in three steps</text>
<text class="s" x="60" y="112" font-size="19" font-weight="500" fill="#57534a">Run these inside Claude Code.</text>
<rect x="60" y="144" width="760" height="130" rx="18" fill="#ffffff" stroke="#e8e4da" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="104" cy="186" r="22" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text class="s" x="104" y="194" font-size="22" font-weight="800" fill="#1c1a15" text-anchor="middle">1</text>
<text class="s" x="142" y="194" font-size="22" font-weight="800" fill="#1c1a15">Add the marketplace</text>
<rect x="142" y="216" width="650" height="36" rx="10" fill="#f4f2ed" stroke="#e2ddd2" stroke-width="1.5"/>
<text class="m" x="158" y="240" font-size="16" font-weight="600" fill="#1c1a15">/plugin marketplace add adhibuchori/agent-config-kit</text>
<path d="M104,278L104,296M99.7,288.1L104,296L108.3,288.1" fill="none" stroke="#57534a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="60" y="300" width="760" height="174" rx="18" fill="#ffffff" stroke="#e8e4da" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="104" cy="342" r="22" fill="#fce7f3" stroke="#fbcfe8" stroke-width="1.5"/>
<text class="s" x="104" y="350" font-size="22" font-weight="800" fill="#1c1a15" text-anchor="middle">2</text>
<text class="s" x="142" y="350" font-size="22" font-weight="800" fill="#1c1a15">Install the core and one stack plugin</text>
<rect x="142" y="372" width="650" height="36" rx="10" fill="#f4f2ed" stroke="#e2ddd2" stroke-width="1.5"/>
<text class="m" x="158" y="396" font-size="16" font-weight="600" fill="#1c1a15">/plugin install agent-core@agent-config-kit</text>
<rect x="142" y="416" width="650" height="36" rx="10" fill="#f4f2ed" stroke="#e2ddd2" stroke-width="1.5"/>
<text class="m" x="158" y="440" font-size="16" font-weight="600" fill="#1c1a15">/plugin install agent-fe-nextjs@agent-config-kit</text>
<path d="M104,478L104,496M99.7,488.1L104,496L108.3,488.1" fill="none" stroke="#57534a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="60" y="500" width="760" height="130" rx="18" fill="#ffffff" stroke="#e8e4da" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="104" cy="542" r="22" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text class="s" x="104" y="550" font-size="22" font-weight="800" fill="#1c1a15" text-anchor="middle">3</text>
<text class="s" x="142" y="550" font-size="22" font-weight="800" fill="#1c1a15">Run setup for your repo</text>
<rect x="142" y="572" width="650" height="36" rx="10" fill="#f4f2ed" stroke="#e2ddd2" stroke-width="1.5"/>
<text class="m" x="158" y="596" font-size="16" font-weight="600" fill="#1c1a15">/&lt;plugin&gt;:setup</text>
<text class="s" x="142" y="662" font-size="17" font-weight="500" fill="#57534a">Setup shows a dry run first and applies only after you approve.</text>
