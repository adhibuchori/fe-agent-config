<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-labelledby="t d">
<title id="t">How a hook decides</title>
<desc id="d">The hedgehog inspects each command. 'git push --force origin main' is blocked with exit code 2 and the agent is told why; 'git status' is allowed with exit code 0.</desc>
<defs>
<style>.s{font-family:'Plus Jakarta Sans', system-ui, sans-serif}.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-variant-ligatures:none}.eye,.mag,.ar,.blk,.alw,.minus,.chk,.band{transform-box:fill-box}.eye{transform-origin:50% 50%;animation:blink 4.6s ease-in-out infinite}@keyframes blink{0%,93%,96%,100%{transform:scaleY(1)}94%,95%{transform:scaleY(.1)}}.ring{opacity:0;animation:ring 7s ease-in-out infinite}@keyframes ring{0%,4.29%,25.71%,100%{opacity:0}8.57%,20%{opacity:1}}.band{opacity:0;animation:scan 7s ease-in-out infinite}@keyframes scan{0%,5.71%{opacity:0;transform:translateX(-90px)}7.86%,16.43%{opacity:1}18.57%,100%{opacity:0;transform:translateX(340px)}}.hl{opacity:0;animation:hl 7s ease-in-out infinite}@keyframes hl{0%,12.86%,20.71%,100%{opacity:0}16.43%{opacity:1}}.a1{animation:a1 7s ease-in-out infinite}@keyframes a1{0%,12.86%,20.71%,100%{transform:translate(0,0)}16.43%{transform:translate(2.2px,2.0px)}}.a2{animation:a2 7s ease-in-out infinite}@keyframes a2{0%,12.86%,20.71%,100%{transform:translate(0,0)}16.43%{transform:translate(2.2px,-2.0px)}}.a3{animation:a3 7s ease-in-out infinite}@keyframes a3{0%,12.86%,20.71%,100%{transform:translate(0,0)}16.43%{transform:translate(1.8px,-2.4px)}}.a4{animation:a4 7s ease-in-out infinite}@keyframes a4{0%,12.86%,20.71%,100%{transform:translate(0,0)}16.43%{transform:translate(1.8px,2.4px)}}.a2,.a2 .hl{animation-delay:.6s}.a3,.a3 .hl{animation-delay:2.9s}.a4,.a4 .hl{animation-delay:3.5s}.b2 .ring,.b2 .band{animation-delay:2.9s}.mag{transform-origin:2px 68px;animation:tilt 7s ease-in-out infinite}@keyframes tilt{0%,14.29%,32.86%,55.71%,74.29%,100%{transform:rotate(0deg)}19.29%,27.14%{transform:rotate(-7deg)}60.71%,68.57%{transform:rotate(6deg)}}.blk,.alw{transform-origin:50% 50%;animation:pop 7s ease-in-out infinite}@keyframes pop{0%,24.29%,35.71%,100%{transform:scale(1)}29.29%{transform:scale(1.03)}}.glow{opacity:0;animation:glow 7s ease-in-out infinite}@keyframes glow{0%,24.29%,40%,100%{opacity:0}29.29%,32.86%{opacity:.75}}.alw,.alw .glow{animation-delay:2.9s}.minus{transform-origin:50% 50%;animation:shake 7s ease-in-out infinite}@keyframes shake{0%,29.29%,36.43%,100%{transform:translateX(0) rotate(0deg)}30.71%{transform:translateX(-4px) rotate(-4deg)}32.14%{transform:translateX(4px) rotate(4deg)}33.57%{transform:translateX(-3px) rotate(-3deg)}35%{transform:translateX(2px) rotate(2deg)}}.chk{transform-origin:50% 50%;animation:chk 7s ease-in-out 2.9s infinite}@keyframes chk{0%,29.29%,36.43%,100%{transform:scale(1)}31.71%{transform:scale(1.18)}34.29%{transform:scale(.96)}}.glint{animation:glint 4.6s ease-in-out infinite}@keyframes glint{0%,93%,96%,100%{opacity:1}93.6%,95.4%{opacity:0}}@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}</style>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
<feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1c1a15" flood-opacity="0.08"/>
</filter>
<filter id="gl" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
